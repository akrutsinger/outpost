[package]
name = "outpost"
version = "0.1.0"
edition = "2024"

[dependencies]
# Terminal tabs: a shell in a pseudo-terminal, and an emulator for its screen.
portable-pty = "0.9.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls"] }
ratatui = "0.30.2"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
vt100 = "0.18.1"

[dev-dependencies]
# PEM output, to test loading certificate files without writing any.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
